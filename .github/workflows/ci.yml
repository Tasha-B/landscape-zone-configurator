name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    # The name is a required check in the main ruleset: keep it as is
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm workspaces: one lockfile in the root installs every app
      - name: Install dependencies
        run: npm ci

      # The types are generated from backend/openapi.json and committed; a
      # difference means the API changed without `npm run api:types`
      - name: Check the API types are up to date
        run: npm run api:types && git diff --exit-code frontend/src/lib/api/schema.d.ts

      - name: Lint
        run: npm run lint -w frontend

      - name: Typecheck
        run: npm run typecheck -w frontend

      - name: Test
        run: npm test -w frontend

      - name: Build
        run: npm run build -w frontend

  backend:
    # Runs in parallel with the frontend job. No path filter: a required
    # check that never runs would block every PR.
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The e2e tests need Postgres: the same image as docker-compose.yml, with
    # the test database created up front
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lzc
          POSTGRES_PASSWORD: lzc
          POSTGRES_DB: lzc_test
        ports:
          - 5432:5432
        # Steps start only once the service reports healthy
        options: >-
          --health-cmd "pg_isready -U lzc -d lzc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Wins over the default in vitest.config.e2e.ts. There is no backend/.env
    # in CI, and prisma.config.ts does not override what is set here.
    env:
      DATABASE_URL: postgresql://lzc:lzc@localhost:5432/lzc_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w backend

      - name: Typecheck
        run: npm run typecheck -w backend

      - name: Unit tests
        run: npm test -w backend

      # The e2e setup applies them as well; a separate step makes a broken
      # migration show up as such, not as a failing test run
      - name: Apply migrations
        run: npm run db:deploy -w backend

      - name: E2E tests
        run: npm run test:e2e -w backend

      - name: Build
        run: npm run build -w backend

      # backend/openapi.json is committed, and the frontend's types are
      # generated from it; a difference means `npm run api:spec` was not run
      - name: Check the OpenAPI document is up to date
        run: npm run api:spec && git diff --exit-code backend/openapi.json
