# The built app, and /api forwarded to the API, on one origin. Replaces the
# image's default server (conf.d/default.conf), inside its http block.

# A request asking for a WebSocket keeps asking for it on the way to the API
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects keep the port the browser used, which may not be 8080
    absolute_redirect off;

    # Docker's DNS, asked again once an answer is 10 s old. A plain
    # proxy_pass resolves the API once, when nginx starts, and a recreated API
    # container with a new address would stay unreachable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    gzip on;
    # Level 1, nginx's default, leaves the bundle a sixth larger
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # REST, Swagger UI and the socket (/api/socket.io). Socket.IO pings every
    # 25 s, inside the default 60 s read timeout.
    location /api/ {
        # With a variable and no path, the request's URI goes on as it came
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed names: a new build gets new ones. A missing file is a 404, not
    # the page, and is not cached (no "always"). (A location with its own
    # add_header drops the server's, so each one names all of its headers.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else is the app, which routes on its own, so a reload of
    # /plans/:id/edit gets index.html. Checked on every visit, so a new build
    # reaches people at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
